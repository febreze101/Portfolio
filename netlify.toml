# Netlify build config for the Astro site in `site/`.
#
# The Studio in `studio/` is not deployed here — it runs locally via
# `sanity dev`, or is published separately with `sanity deploy`.

[build]
  # Build from the site subdirectory; `publish` is resolved relative to it.
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # site/package.json requires >=22.12.0.
  NODE_VERSION = "22"

  # Not secrets: the project id is already committed in
  # studio/sanity.config.ts, and the production dataset is public-read.
  # Keeping them here means a fresh deploy needs no manual env setup.
  PUBLIC_SANITY_PROJECT_ID = "hvkunqtv"
  PUBLIC_SANITY_DATASET = "production"

# Long-cache the fingerprinted bundles Astro emits.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
